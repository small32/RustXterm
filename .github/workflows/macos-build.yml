name: macOS build

# 说明：
# - 本流水线只在 macOS runner 上跑。macOS 产物（.app/.dmg/universal binary）
#   无法在 Windows 上交叉构建，详见项目讨论结论。
# - 当前为「未签名构建」，用于验证产物能正常打出；签名与公证见文件末尾的注释块。
# - 注意：macOS runner 计费倍率高于 Linux，私有仓库请按需触发。

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: 编译校验（前端 build + cargo check）
    runs-on: macos-latest
    defaults:
      run:
        working-directory: moba-rust
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: moba-rust/package-lock.json

      - name: 安装 Rust 工具链与 macOS 目标
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: 缓存 Rust 依赖
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: moba-rust/src-tauri

      - name: 安装前端依赖
        run: npm ci

      - name: 前端构建
        run: npm run build

      - name: Rust 编译校验（macOS arm64）
        run: cargo check --manifest-path src-tauri/Cargo.toml --target aarch64-apple-darwin

  bundle:
    name: 打包 .app + .dmg（universal）
    needs: verify
    runs-on: macos-latest
    defaults:
      run:
        working-directory: moba-rust
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: moba-rust/package-lock.json

      - name: 安装 Rust 工具链与 macOS 目标
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: 缓存 Rust 依赖
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: moba-rust/src-tauri

      - name: 安装前端依赖
        run: npm ci

      - name: 打包（universal，未签名）
        run: npx tauri build --target universal-apple-darwin

      - name: 列出 bundle 产物
        run: find src-tauri/target/universal-apple-darwin/release/bundle -maxdepth 2

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: MobaRust-macos-universal
          # 注意：upload-artifact 的 path 相对仓库根目录解析，
          # 不受上面 defaults.run.working-directory 影响，故需带 moba-rust/ 前缀。
          path: |
            moba-rust/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            moba-rust/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app
          if-no-files-found: error
          retention-days: 14

# ---------------------------------------------------------------------------
